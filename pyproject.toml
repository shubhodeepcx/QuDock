[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qudock"
dynamic = ["version"]
description = "Quantum kernels vs classical models for BACE-1 inhibitor screening"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-machine-learning>=0.9",
    "qiskit-ibm-runtime>=0.30",
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["jupyterlab>=4.0", "pylatexenc>=2.10"]
app = ["streamlit>=1.40", "pylatexenc>=2.10"]

[project.scripts]
qudock = "qudock.cli:main"

[tool.setuptools.dynamic]
version = {attr = "qudock.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# zip() over arrays we built to the same length; strict= would only add noise
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# streamlit needs src/ on sys.path before the qudock imports, and UI strings run long
"app/app.py" = ["E402", "E501"]
