[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qudock"
dynamic = ["version"]
description = "Quantum kernels vs classical models for BACE-1 inhibitor screening"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Shubhodeep Chatterjee"},
    {name = "Srijita Banerjee"},
    {name = "Rounak Pal"},
]
keywords = ["quantum machine learning", "quantum kernels", "qiskit", "drug discovery",
            "cheminformatics", "alzheimer's", "bace-1", "virtual screening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-machine-learning>=0.9",
    "qiskit-ibm-runtime>=0.30",
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]
notebook = ["jupyterlab>=4.0", "pylatexenc>=2.10"]
app = ["streamlit>=1.40", "pylatexenc>=2.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-blackout"
Demo = "https://qudock-blackout.streamlit.app/"
Issues = "https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-blackout/issues"

[project.scripts]
qudock = "qudock.cli:main"

[tool.setuptools.dynamic]
version = {attr = "qudock.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# zip() over arrays we built to the same length; strict= would only add noise
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# streamlit needs src/ on sys.path before the qudock imports, and UI strings run long
"app/app.py" = ["E402", "E501"]
