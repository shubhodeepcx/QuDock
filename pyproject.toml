[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qudock"
version = "0.1.0"
description = "Quantum kernels vs classical models for BACE-1 inhibitor screening"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-machine-learning>=0.9",
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
qudock = "qudock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
