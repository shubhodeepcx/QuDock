name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
        env:
          # qiskit-aer and scikit-learn each bundle OpenMP; give glibc room for both.
          # Only set for pytest: it shrinks thread stacks enough to crash ruff.
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096000
