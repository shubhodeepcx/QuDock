name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
        env:
          # qiskit-aer and scikit-learn each bundle OpenMP; give glibc room for both.
          # Only set for pytest: it shrinks thread stacks enough to crash ruff.
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096000
          # that also eats the 2 MB default stack of Rust threads (Qiskit's transpiler)
          RUST_MIN_STACK: "33554432"
          OMP_STACKSIZE: 64M
